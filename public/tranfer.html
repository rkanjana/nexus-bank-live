<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transfer Money — NEXUS Bank</title>
    <link rel="stylesheet" href="css/nexus-theme.css">
</head>
<body>
    <div class="nx-app">
        <aside class="nx-sidebar" id="nx-sidebar-mount"></aside>
        <main class="nx-main">
            <div class="nx-topbar"><h1>Transfer Money</h1></div>
            <div class="nx-content" style="max-width:560px;">
                <div class="nx-card">
                    <div class="nx-field" id="beneficiaryPickWrap" style="display:none;">
                        <label for="beneficiaryPick">Send to a saved beneficiary</label>
                        <select id="beneficiaryPick">
                            <option value="">— choose or enter manually below —</option>
                        </select>
                    </div>

                    <div class="nx-field">
                        <label for="receiver_account">To Account Number</label>
                        <input type="text" id="receiver_account" placeholder="Enter receiver's account number">
                    </div>

                    <div class="nx-field">
                        <label for="amount">Amount (₹)</label>
                        <input type="number" id="amount" placeholder="Enter amount" min="1">
                    </div>

                    <button class="nx-btn nx-btn-primary nx-btn-block" id="transferBtn">Transfer Money</button>
                    <div class="nx-alert" id="message"></div>
                </div>
            </div>
        </main>
    </div>

    <script src="js/nexus-app.js"></script>
    <script>
        nxRenderSidebar();
        loadBeneficiaries();
        document.getElementById('transferBtn').addEventListener('click', transferMoney);
        document.getElementById('beneficiaryPick').addEventListener('change', function () {
            if (this.value) document.getElementById('receiver_account').value = this.value;
        });

        async function loadBeneficiaries() {
            try {
                const response = await nxApiFetch('/beneficiaries');
                const data = await response.json();
                if (data.beneficiaries && data.beneficiaries.length) {
                    const select = document.getElementById('beneficiaryPick');
                    data.beneficiaries.forEach(b => {
                        const opt = document.createElement('option');
                        opt.value = b.beneficiary_account_number;
                        opt.textContent = `${b.nickname} — ${b.beneficiary_account_number}`;
                        select.appendChild(opt);
                    });
                    document.getElementById('beneficiaryPickWrap').style.display = 'block';
                }
            } catch (e) { /* not fatal, manual entry still works */ }
        }

        async function transferMoney() {
            const receiverAccount = document.getElementById('receiver_account').value.trim();
            const amount = parseFloat(document.getElementById('amount').value);
            const messageEl = document.getElementById('message');
            const btn = document.getElementById('transferBtn');

            messageEl.className = 'nx-alert';

            if (!receiverAccount || !amount || isNaN(amount) || amount <= 0) {
                return showMessage('Please enter a valid receiver account and amount', 'error');
            }

            btn.disabled = true;
            btn.textContent = 'Processing…';

            try {
                const response = await nxApiFetch('/transfer', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ receiver_account: receiverAccount, amount })
                });

                const result = await response.json();
                if (!response.ok || !result.success) throw new Error(result.error || 'Transfer failed');

                showMessage(result.message, 'success');
                document.getElementById('receiver_account').value = '';
                document.getElementById('amount').value = '';
            } catch (error) {
                showMessage(error.message || 'Transfer failed. Please try again.', 'error');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Transfer Money';
            }
        }

        function showMessage(text, type) {
            const messageEl = document.getElementById('message');
            messageEl.textContent = text;
            messageEl.className = `nx-alert nx-alert-${type} show`;
        }
    </script>
</body>
</html>
