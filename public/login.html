<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — NEXUS Bank</title>
    <link rel="stylesheet" href="css/nexus-theme.css">
</head>
<body>
    <div class="nx-auth-wrap">
        <div class="nx-auth-card">
            <div class="nx-brand"><span class="nx-mark">N</span> NEXUS Bank</div>
            <h2>Welcome back</h2>
            <p class="nx-sub">Choose how you'd like to sign in</p>

            <div style="display:flex; flex-direction:column; gap:12px;">
                <button class="nx-btn nx-btn-primary nx-btn-block" onclick="window.location.href='userloginpage.html'">
                    Customer Login
                </button>
                <button class="nx-btn nx-btn-outline nx-btn-block" onclick="window.location.href='employeeloginpage.html'">
                    Employee / Staff Login
                </button>
            </div>

            <div class="nx-auth-links">
                New to NEXUS Bank? <a href="aboutacc.html">Open an account</a>
            </div>
        </div>
    </div>
</body>
</html>
